name: release

on:
  push:
    tags:
      - "release-*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  AUR_PACKAGE_NAME: gvm-bin

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --locked

  build-release:
    name: build ${{ matrix.job_name }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - archive_target: linux-x86_64
            job_name: linux-x64
            runs_on: ubuntu-latest
            rust_target: x86_64-unknown-linux-musl
            install_command: |
              sudo apt-get update
              sudo apt-get install -y musl-tools
            binary_name: gvm
          - archive_target: linux-aarch64
            job_name: linux-arm64
            runs_on: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            install_command: ":"
            binary_name: gvm
          - archive_target: android-aarch64
            job_name: android-arm64
            runs_on: ubuntu-24.04
            rust_target: aarch64-linux-android
            android_triple: aarch64-linux-android
            android_api: 21
            platform: android
            install_command: ":"
            binary_name: gvm
          - archive_target: android-x86_64
            job_name: android-x64
            runs_on: ubuntu-24.04
            rust_target: x86_64-linux-android
            android_triple: x86_64-linux-android
            android_api: 21
            platform: android
            install_command: ":"
            binary_name: gvm
          - archive_target: darwin-x86_64
            job_name: macos-x64
            runs_on: macos-15-intel
            rust_target: x86_64-apple-darwin
            install_command: ":"
            binary_name: gvm
          - archive_target: darwin-aarch64
            job_name: macos-arm64
            runs_on: macos-latest
            rust_target: aarch64-apple-darwin
            install_command: ":"
            binary_name: gvm
          - archive_target: windows-x86_64
            job_name: windows-x64
            runs_on: windows-latest
            rust_target: x86_64-pc-windows-msvc
            install_command: ":"
            binary_name: gvm.exe
          - archive_target: windows-aarch64
            job_name: windows-arm64
            runs_on: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
            install_command: ":"
            binary_name: gvm.exe
    runs-on: ${{ matrix.runs_on }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Derive release version
        id: release_meta
        run: echo "version=${GITHUB_REF_NAME#release-}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Set up Android SDK
        if: ${{ matrix.platform == 'android' }}
        uses: android-actions/setup-android@v3

      - name: Configure Android NDK
        if: ${{ matrix.platform == 'android' }}
        env:
          ANDROID_NDK_VERSION: 27.2.12479018
        run: |
          sdkmanager --install "ndk;${ANDROID_NDK_VERSION}"
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "${sdk_root}" ]; then
            echo "Android SDK root is not configured" >&2
            exit 1
          fi
          ndk_root="${sdk_root}/ndk/${ANDROID_NDK_VERSION}"
          toolchain_dir="${ndk_root}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          linker="${toolchain_dir}/${{ matrix.android_triple }}${{ matrix.android_api }}-clang"
          if [ ! -x "${linker}" ]; then
            echo "Android linker not found: ${linker}" >&2
            exit 1
          fi
          target_key="$(printf '%s' '${{ matrix.rust_target }}' | tr '[:lower:]-' '[:upper:]_')"
          echo "ANDROID_NDK_HOME=${ndk_root}" >> "${GITHUB_ENV}"
          echo "${toolchain_dir}" >> "${GITHUB_PATH}"
          echo "CARGO_TARGET_${target_key}_LINKER=${linker}" >> "${GITHUB_ENV}"
          echo "CC_${target_key}=${linker}" >> "${GITHUB_ENV}"
          echo "AR_${target_key}=${toolchain_dir}/llvm-ar" >> "${GITHUB_ENV}"

      - name: Install system dependencies
        run: ${{ matrix.install_command }}

      - name: Build release binary
        run: cargo build --locked --release --target "${{ matrix.rust_target }}"

      - name: Package release archive
        run: |
          chmod +x ./scripts/build-release-archive.sh
          mkdir -p dist
          ./scripts/build-release-archive.sh \
            "${{ steps.release_meta.outputs.version }}" \
            "${{ matrix.archive_target }}" \
            "./target/${{ matrix.rust_target }}/release/${{ matrix.binary_name }}" \
            dist

      - name: Export standalone Windows exe
        if: ${{ endsWith(matrix.binary_name, '.exe') }}
        env:
          VERSION: ${{ steps.release_meta.outputs.version }}
          SOURCE_BINARY: ./target/${{ matrix.rust_target }}/release/${{ matrix.binary_name }}
          EXE_ASSET: gvm-${{ steps.release_meta.outputs.version }}-${{ matrix.archive_target }}.exe
        run: |
          cp "${SOURCE_BINARY}" "dist/${EXE_ASSET}"
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          path = Path("dist") / os.environ["EXE_ASSET"]
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          (path.parent / f"{path.name}.sha256").write_text(
              f"{digest}  {path.name}\n",
              encoding="utf-8",
          )
          PY

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-dist-${{ matrix.archive_target }}
          path: dist/*

  publish-release:
    name: publish
    needs: build-release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive release version
        id: release_meta
        run: echo "version=${GITHUB_REF_NAME#release-}" >> "$GITHUB_OUTPUT"

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-dist-*
          merge-multiple: true
          path: dist

      - name: Generate release notes
        run: |
          previous_tag="$(git tag -l 'release-*' | grep -Fxv "${GITHUB_REF_NAME}" | sort -V | tail -n 1 || true)"
          if [ -n "${previous_tag}" ]; then
            range="${previous_tag}..HEAD"
          else
            range="HEAD"
          fi
          RANGE="${range}" VERSION="${{ steps.release_meta.outputs.version }}" python - <<'PY'
          import os
          import re
          import subprocess

          range_spec = os.environ["RANGE"]
          version = os.environ["VERSION"]
          output = subprocess.check_output(
              ["git", "log", "--no-merges", "--format=%h%x00%s%x00%b%x00%x1e", range_spec],
              text=True,
          )
          commits = []
          for record in output.split("\x1e"):
              fields = record.strip("\n").split("\x00")
              if len(fields) < 3 or not fields[1].strip():
                  continue
              commits.append(
                  {
                      "hash": fields[0].strip(),
                      "subject": fields[1].strip(),
                      "body": [
                          line.strip()
                          for line in fields[2].splitlines()
                          if line.strip() and not line.strip().startswith("Co-authored-by:")
                      ],
                  }
              )

          groups = [
              ("Features", re.compile(r"^feat(?:\([^)]*\))?:")),
              ("Fixes", re.compile(r"^fix(?:\([^)]*\))?:")),
              ("Docs", re.compile(r"^docs(?:\([^)]*\))?:")),
              (
                  "Build",
                  re.compile(r"^(?:build|config|chore|ci)(?:\([^)]*\))?:"),
              ),
          ]
          grouped = {name: [] for name, _ in groups}
          other = []

          for commit in commits:
              lowered = commit["subject"].lower()
              matched = False
              for name, pattern in groups:
                  if pattern.match(lowered):
                      grouped[name].append(commit)
                      matched = True
                      break
              if not matched:
                  other.append(commit)

          lines = [
              f"# gvm {version}",
              "",
              f"This release contains {len(commits)} change(s) since the previous release.",
              "",
              "## What's Changed",
              "",
          ]
          emitted = False
          for name, _ in groups:
              entries = grouped[name]
              if not entries:
                  continue
              emitted = True
              lines.append(f"### {name}")
              for entry in entries:
                  lines.append(f"- `{entry['hash']}` {entry['subject']}")
                  lines.extend(f"  {line}" for line in entry["body"])
              lines.append("")

          if other:
              emitted = True
              lines.append("### Other")
              for entry in other:
                  lines.append(f"- `{entry['hash']}` {entry['subject']}")
                  lines.extend(f"  {line}" for line in entry["body"])
              lines.append("")

          if not emitted:
              lines.extend(["- No user-facing changes recorded", ""])

          lines.extend(
              [
                  "## Downloads",
                  "",
                  "- linux-x86_64",
                  "- linux-aarch64",
                  "- android-x86_64",
                  "- android-aarch64",
                  "- darwin-x86_64",
                  "- darwin-aarch64",
                  "- windows-x86_64",
                  "- windows-aarch64",
                  "- windows-x86_64.exe",
                  "- windows-aarch64.exe",
                  "",
                  "## Installation",
                  "",
                  "```bash",
                  "curl -fsSL https://raw.githubusercontent.com/crowforkotlin/gradle-version-manager/main/install.sh -o install.sh",
                  "sh install.sh --activate",
                  "```",
                  "",
              ]
          )

          with open("dist/release-notes.md", "w", encoding="utf-8") as handle:
              handle.write("\n".join(lines))
          PY

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.release_meta.outputs.version }}
          body_path: dist/release-notes.md
          files: |
            dist/*.tar.gz
            dist/*.exe
            dist/*.sha256

      - name: Refresh release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release_meta.outputs.version }}
        run: |
          gh release edit "${GITHUB_REF_NAME}" \
            --title "${VERSION}" \
            --notes-file dist/release-notes.md

      - name: Remove stale release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release_meta.outputs.version }}
        run: |
          python - <<'PY'
          import json
          import time
          import os
          import urllib.error
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["GITHUB_REF_NAME"]
          token = os.environ["GH_TOKEN"]
          version = os.environ["VERSION"]
          wanted = {
              f"gvm-{version}-linux-x86_64.tar.gz",
              f"gvm-{version}-linux-x86_64.tar.gz.sha256",
              f"gvm-{version}-linux-aarch64.tar.gz",
              f"gvm-{version}-linux-aarch64.tar.gz.sha256",
              f"gvm-{version}-android-x86_64.tar.gz",
              f"gvm-{version}-android-x86_64.tar.gz.sha256",
              f"gvm-{version}-android-aarch64.tar.gz",
              f"gvm-{version}-android-aarch64.tar.gz.sha256",
              f"gvm-{version}-darwin-x86_64.tar.gz",
              f"gvm-{version}-darwin-x86_64.tar.gz.sha256",
              f"gvm-{version}-darwin-aarch64.tar.gz",
              f"gvm-{version}-darwin-aarch64.tar.gz.sha256",
              f"gvm-{version}-windows-x86_64.tar.gz",
              f"gvm-{version}-windows-x86_64.tar.gz.sha256",
              f"gvm-{version}-windows-x86_64.exe",
              f"gvm-{version}-windows-x86_64.exe.sha256",
              f"gvm-{version}-windows-aarch64.tar.gz",
              f"gvm-{version}-windows-aarch64.tar.gz.sha256",
              f"gvm-{version}-windows-aarch64.exe",
              f"gvm-{version}-windows-aarch64.exe.sha256",
          }
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          release_url = f"https://api.github.com/repos/{repo}/releases/tags/{tag}"
          release = None
          for attempt in range(5):
              request = urllib.request.Request(release_url, headers=headers)
              try:
                  with urllib.request.urlopen(request) as response:
                      release = json.load(response)
                  break
              except urllib.error.HTTPError as exc:
                  if exc.code == 404 and attempt < 4:
                      time.sleep(3)
                      continue
                  if exc.code == 404:
                      print("release not visible yet; skipping stale asset cleanup")
                      raise SystemExit(0)
                  raise

          prefix = f"gvm-{version}-"
          for asset in release.get("assets", []):
              name = asset["name"]
              if name.startswith(prefix) and name not in wanted:
                  delete = urllib.request.Request(
                      asset["url"],
                      headers=headers,
                      method="DELETE",
                  )
                  try:
                      with urllib.request.urlopen(delete):
                          pass
                      print(f"deleted {name}")
                  except urllib.error.HTTPError as exc:
                      print(f"skipped deleting {name}: HTTP {exc.code}")
          PY

  publish-aur:
    name: publish aur
    needs: publish-release
    runs-on: ubuntu-latest

    steps:
      - name: Check AUR secret
        id: aur
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -n "${AUR_SSH_PRIVATE_KEY}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: ${{ steps.aur.outputs.enabled == 'true' }}
        uses: actions/checkout@v4

      - name: Derive release version
        if: ${{ steps.aur.outputs.enabled == 'true' }}
        id: release_meta
        run: echo "version=${GITHUB_REF_NAME#release-}" >> "$GITHUB_OUTPUT"

      - name: Download packaged artifacts
        if: ${{ steps.aur.outputs.enabled == 'true' }}
        uses: actions/download-artifact@v4
        with:
          pattern: release-dist-*
          merge-multiple: true
          path: dist

      - name: Start SSH agent
        if: ${{ steps.aur.outputs.enabled == 'true' }}
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

      - name: Trust AUR host key
        if: ${{ steps.aur.outputs.enabled == 'true' }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts

      - name: Publish AUR package
        if: ${{ steps.aur.outputs.enabled == 'true' }}
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          chmod +x ./scripts/render-aur-package.sh
          VERSION="${{ steps.release_meta.outputs.version }}"
          X86_64_SHA="$(cut -d' ' -f1 "dist/gvm-${VERSION}-linux-x86_64.tar.gz.sha256")"
          AARCH64_SHA="$(cut -d' ' -f1 "dist/gvm-${VERSION}-linux-aarch64.tar.gz.sha256")"
          WORKDIR="$(mktemp -d)"
          trap 'rm -rf "${WORKDIR}"' EXIT INT TERM
          REPO_DIR="${WORKDIR}/${AUR_PACKAGE_NAME}"

          cloned=0
          for attempt in 1 2 3 4 5; do
            if git clone "ssh://aur@aur.archlinux.org/${AUR_PACKAGE_NAME}.git" "${REPO_DIR}"; then
              cloned=1
              break
            fi
            rm -rf "${REPO_DIR}"
            if [ "${attempt}" -lt 5 ]; then
              sleep $((attempt * 15))
            fi
          done
          if [ "${cloned}" -ne 1 ]; then
            echo "failed to clone AUR package after 5 attempts" >&2
            exit 1
          fi

          CURRENT_PKGVER=
          CURRENT_PKGREL=
          if [ -f "${REPO_DIR}/PKGBUILD" ]; then
            CURRENT_PKGVER="$(sed -n 's/^pkgver=//p' "${REPO_DIR}/PKGBUILD" | head -n 1)"
            CURRENT_PKGREL="$(sed -n 's/^pkgrel=//p' "${REPO_DIR}/PKGBUILD" | head -n 1)"
          fi
          CANDIDATE_PKGREL=1
          if [ "${CURRENT_PKGVER}" = "${VERSION}" ] && [ -n "${CURRENT_PKGREL}" ]; then
            CANDIDATE_PKGREL="${CURRENT_PKGREL}"
          fi

          render_pkgbuild() {
            ./scripts/render-aur-package.sh \
              "${REPO_DIR}" \
              "${AUR_PACKAGE_NAME}" \
              "${VERSION}" \
              "$1" \
              "${{ github.repository }}" \
              x86_64 "${X86_64_SHA}" \
              aarch64 "${AARCH64_SHA}"
          }

          render_pkgbuild "${CANDIDATE_PKGREL}"
          cd "${REPO_DIR}"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "AUR package is already up to date"
            exit 0
          fi

          if [ "${CURRENT_PKGVER}" = "${VERSION}" ] && [ -n "${CURRENT_PKGREL}" ]; then
            NEXT_PKGREL="$((CURRENT_PKGREL + 1))"
            cd "${GITHUB_WORKSPACE}"
            render_pkgbuild "${NEXT_PKGREL}"
            cd "${REPO_DIR}"
            git add PKGBUILD .SRCINFO
          fi

          PKGREL="$(sed -n 's/^pkgrel=//p' PKGBUILD | head -n 1)"
          git commit -m "Update to ${VERSION}-${PKGREL}"
          git push origin HEAD:master

      - name: Skip AUR publish
        if: ${{ steps.aur.outputs.enabled != 'true' }}
        run: echo "AUR_SSH_PRIVATE_KEY is not configured; skipping AUR publish"
